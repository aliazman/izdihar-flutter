name: Build Izdihar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Get app source
        uses: actions/checkout@v4

      - name: Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android platform 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate Android project, configure notifications, get packages
        run: python3 tool/bootstrap.py

      - name: Validate authored session content
        run: flutter test

      - name: Build installable Android APK
        run: flutter build apk --release

      - name: Make APK available for download
        uses: actions/upload-artifact@v4
        with:
          name: Izdihar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
